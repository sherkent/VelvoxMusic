name: Build and Release Velvox Music

on:
  push:
    branches: [main, master]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Velvox Music (Windows)
    # Pin to windows-2022 to guarantee Visual Studio 2022 is present.
    runs-on: windows-2022
    env:
      # Use the GitHub Actions cache as vcpkg binary cache to avoid rebuilding
      # TagLib on every run.
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
      VCPKG_DEFAULT_TRIPLET: x64-windows

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.*'
        arch: 'win64_msvc2022_64'
        # qtsvg and QtQuick.Effects are part of the base Qt 6.8 package.
        # qtshadertools is used by ShaderEffect; qt5compat provides Core5Compat
        # (required by QTextCodec).
        modules: 'qtshadertools qt5compat'
        cache: true

    - name: Lint QML
      run: |
        $qmllint = "$env:QT_ROOT_DIR\bin\qmllint.exe"
        if (-Not (Test-Path $qmllint)) {
          Write-Error "qmllint not found at $qmllint"
          exit 1
        }
        & $qmllint qml
      shell: pwsh

    - name: Ensure vcpkg is available
      run: |
        $vcpkgRoot = "C:\vcpkg"
        if (-Not (Test-Path "$vcpkgRoot\vcpkg.exe")) {
          if (Test-Path $vcpkgRoot) { Remove-Item -Recurse -Force $vcpkgRoot }
          git clone https://github.com/microsoft/vcpkg.git $vcpkgRoot
          & "$vcpkgRoot\bootstrap-vcpkg.bat"
        }
        Write-Host "VCPKG_ROOT=$vcpkgRoot"
        "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      shell: pwsh

    - name: Install Inno Setup
      run: choco install innosetup --no-progress -y
      shell: pwsh

    - name: Determine version string
      id: version
      run: |
        $version = "${{ github.ref_name }}" -replace '/', '-'
        "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      shell: pwsh

    - name: Configure CMake
      run: |
        cmake -B build -S . `
          -G "Visual Studio 17 2022" `
          -A x64 `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake"
      shell: pwsh

    - name: Build
      run: cmake --build build --config Release --parallel
      shell: pwsh

    - name: Package portable zip
      run: |
        New-Item -ItemType Directory -Force -Path dist | Out-Null
        $zipName = "dist\VelvoxMusic-${{ steps.version.outputs.version }}-win64-portable.zip"
        $items = Get-ChildItem -Path build\Release | Where-Object {
            $_.Name -notmatch '\.(pdb|ilk|exp)$'
        } | Select-Object -ExpandProperty FullName
        Compress-Archive -Path $items -DestinationPath $zipName -Force
      shell: pwsh

    - name: Build installer
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\VelvoxMusic.iss
      shell: pwsh

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-release-${{ steps.version.outputs.version }}
        path: |
          dist/*.zip
          dist/*.exe

  release:
    name: Create GitHub Release
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release-${{ github.ref_name }}
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
